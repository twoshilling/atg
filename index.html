<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ATG Tracker">
<meta name="theme-color" content="#120F18">
<title>ATG Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#120F18;--card:#1B1724;--line:#231E2E;--track:#2A2436;--text:#F4EFF8;--soft:#C3B9CF;--muted:#8B819A;--accent:#FFB08A;--accent-ink:#2A1208;--accent-bg:#3A2622;--good:#7FD1A8;--warn:#F7C873;--pink:#F27FB2;--blue:#7FB3F0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,sans-serif}
button,select,input{font-family:inherit}
button{cursor:pointer}
.app{max-width:480px;margin:0 auto;min-height:100vh;padding:calc(env(safe-area-inset-top) + 24px) 20px calc(env(safe-area-inset-bottom) + 96px)}
h1{margin:0;font-family:'Space Grotesk',sans-serif;font-size:30px;font-weight:700;letter-spacing:-.5px}
h2{margin:0;font-size:16px;font-weight:600}
.muted{color:var(--muted)}
.small{font-size:12px}
.row-between{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.stack{display:flex;flex-direction:column}
.section{margin-top:26px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pcard{text-align:left;border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;color:var(--text);background:var(--card);border:2px solid transparent;min-height:90px}
.pcard.sel{background:var(--accent-bg);border-color:var(--accent)}
.pcard .big{font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700}
.pcard .big small{font-family:Inter,sans-serif;font-size:13px;font-weight:400;color:var(--muted)}
.bar{position:relative;height:6px;border-radius:3px;background:var(--track)}
.bar>i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--accent)}
.bar>b{position:absolute;top:-4px;width:3px;height:14px;border-radius:2px;background:var(--pink)}
.seg{display:flex;background:var(--card);border-radius:12px;padding:3px;flex-shrink:0}
.seg button{height:36px;padding:0 13px;border-radius:9px;border:none;background:transparent;color:var(--muted);font-size:14px}
.seg button.on{background:var(--accent);color:var(--accent-ink);font-weight:600}
.selectwrap{position:relative;flex:1;min-width:0}
.selectwrap select{width:100%;height:42px;border-radius:12px;border:none;background:var(--card);color:var(--text);font-size:14px;padding:0 34px 0 14px;appearance:none;-webkit-appearance:none}
.selectwrap svg{position:absolute;right:13px;top:14px;pointer-events:none}
.exrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);width:100%;background:none;border-left:none;border-right:none;border-top:none;color:var(--text);text-align:left}
.exrow .name{font-size:15px;font-weight:500;display:flex;align-items:center;gap:6px}
.tags{display:flex;gap:5px;flex-wrap:wrap}
.tag{font-size:11px;padding:2px 7px;border-radius:6px;background:#251F31;color:var(--soft)}
.right{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0}
.left-n{font-size:15px;font-weight:600}
.done-c{color:var(--good)}
.stale{color:var(--warn);font-weight:500}
.linkbtn{background:none;border:none;color:var(--accent);font-size:14px;font-weight:500;padding:12px 0;min-height:44px;text-align:left}
.nav{position:fixed;left:0;right:0;bottom:0;background:rgba(18,15,24,.96);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}
.nav .in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.nav button{height:64px;background:none;border:none;color:var(--muted);font-size:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.nav button.on{color:var(--text);font-weight:600}
.nav button.on::before{content:"";width:5px;height:5px;border-radius:3px;background:var(--accent)}
.card{background:var(--card);border-radius:18px;padding:16px 18px}
.btn{height:54px;border-radius:16px;border:none;background:var(--accent);color:var(--accent-ink);font-size:16px;font-weight:600;width:100%}
.btn.ghost{background:transparent;border:1px solid #463C57;color:var(--text);font-weight:500}
.btn.danger{background:transparent;border:1px solid #6B2E2E;color:#F2A3A3;font-weight:500}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:480px;max-height:94vh;overflow-y:auto;background:#161320;border-radius:24px 24px 0 0;padding:18px 20px calc(env(safe-area-inset-bottom) + 24px)}
.grab{width:40px;height:5px;border-radius:3px;background:#352E44;margin:0 auto 14px}
.stepper{display:flex;align-items:center;gap:12px}
.stepper button{width:52px;height:52px;border-radius:14px;border:none;background:var(--card);color:var(--text);font-size:22px}
.stepper .val{flex:1;text-align:center;font-family:'Space Grotesk',sans-serif;font-size:32px;font-weight:700}
.stepper .val small{font-size:16px;color:var(--muted);font-weight:500}
.lbl{font-size:13px;color:var(--muted);margin:16px 0 8px}
.effort{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.effort button{height:54px;border-radius:14px;border:none;background:var(--card);color:var(--soft);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.effort button b{font-size:17px}
.effort button span{font-size:10px}
.effort button.on{background:var(--accent);color:var(--accent-ink)}
.sides{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.sides button{height:44px;border-radius:12px;border:none;background:var(--card);color:var(--soft);font-size:14px}
.sides button.on{background:var(--accent);color:var(--accent-ink);font-weight:600}
.note{border-radius:12px;padding:12px 14px;font-size:13px;line-height:1.45}
.note.warn{background:#33241E;color:#FFE0CC}
.note.good{background:#12261D;color:#BFEBD3}
.timer{position:relative;width:220px;height:220px;margin:6px auto 0}
.timer .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.timer .clock{font-family:'Space Grotesk',sans-serif;font-size:54px;font-weight:700;line-height:1}
.tctrl{display:flex;justify-content:center;align-items:center;gap:20px;margin-top:12px}
.tctrl .r{width:52px;height:52px;border-radius:26px;border:none;background:var(--card);color:var(--soft);font-size:14px;font-weight:600}
.tctrl .p{width:76px;height:76px;border-radius:38px;border:none;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 84px);background:#F4EFF8;color:#111;padding:10px 16px;border-radius:12px;font-size:14px;font-weight:500;z-index:20;max-width:90vw;text-align:center}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-top:14px}
.daybtn{background:none;border:none;padding:4px 0;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;color:var(--muted);border-radius:12px;min-height:44px}
.daybtn:not([disabled]):active{background:var(--card)}
.days div{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;color:var(--muted)}
.dot{width:26px;height:26px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;border:2px solid #2E2740;color:var(--muted)}
.dot.has{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.dot.today{border-color:var(--accent)}
textarea{width:100%;min-height:120px;border-radius:12px;border:1px solid #2E2740;background:var(--card);color:var(--text);padding:10px;font-size:12px;font-family:ui-monospace,monospace}
.back{background:none;border:none;color:var(--accent);font-size:14px;padding:0;min-height:44px}
.hidden{display:none}
.ver{position:absolute;top:calc(env(safe-area-inset-top) + 6px);right:max(20px, calc(50% - 220px));font-size:11px;font-weight:500;color:#6E6580;letter-spacing:.2px;z-index:2;pointer-events:none}
.xr{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.xr .ico{border:none;padding:0}
.xname{background:none;border:none;color:var(--text);font-size:15px;font-weight:600;padding:2px 0;text-align:left;min-height:26px}
.xmeta{font-size:12px;color:var(--muted);margin-top:1px;line-height:1.4}
.circles{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.cc{width:46px;height:46px;border-radius:23px;border:2px solid #3A3249;background:transparent;color:#8B819A;font-size:14px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;padding:0;transition:transform .15s,background .2s,border-color .2s}
.cc:active{transform:scale(.9)}
.cc.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.cc.short{background:#6B4436;border-color:#6B4436;color:#FFE3D4}
.cc.extra{outline:2px solid var(--pink);outline-offset:2px}
.cc{flex-direction:column;line-height:1.05}
.cc .kg{display:block;font-size:10px;font-weight:500;opacity:.85;margin-top:1px}
.ldpill{margin-left:auto;height:36px;padding:0 11px;border-radius:18px;border:1px solid #3A3249;background:transparent;color:var(--muted);font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;align-self:center}
.ldpill.has{color:var(--text);border-color:#5A5068}
.lded{margin-top:12px;background:var(--card);border-radius:16px;padding:12px 14px}
.lc{height:34px;min-width:44px;padding:0 12px;border-radius:17px;border:none;background:#2A2436;color:var(--soft);font-size:13px;font-weight:600}
.lc.on{background:var(--accent);color:var(--accent-ink)}
.cc.add{border-style:dashed;color:var(--muted);font-size:20px;font-weight:400}
.cc{position:relative;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.cc.holding{animation:holdshrink .5s linear forwards}
.cc.holding::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:2px solid #F2A3A3;clip-path:inset(0 0 100% 0);animation:holdring .5s linear forwards}
@keyframes holdshrink{to{transform:scale(.86);background:#5A2B2B;border-color:#5A2B2B;color:#F2A3A3}}
@keyframes holdring{to{clip-path:inset(0 0 0 0)}}
.cc.vanish{animation:vanish .22s ease-in forwards}
@keyframes vanish{to{transform:scale(0);opacity:0}}
.cc.pop{animation:cpop .45s cubic-bezier(.2,1.6,.4,1)}
.cc.pop::after{content:"";position:absolute;inset:-3px;border-radius:50%;border:2px solid var(--accent);animation:burst .6s ease-out forwards;pointer-events:none}
.cc.pop::before{content:"";position:absolute;inset:-3px;border-radius:50%;box-shadow:0 0 0 0 rgba(255,176,138,.55);animation:glow .7s ease-out forwards;pointer-events:none}
@keyframes burst{from{transform:scale(1);opacity:1}to{transform:scale(1.7);opacity:0}}
@keyframes glow{to{box-shadow:0 0 0 14px rgba(255,176,138,0)}}
.xr.justdone{animation:rowdone 1.2s ease-out}
@keyframes rowdone{0%{background:rgba(127,209,168,0)}25%{background:rgba(127,209,168,.10)}100%{background:rgba(127,209,168,0)}}
.bump{display:inline-block;animation:bump .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}
.conf{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px;animation:slideup .35s cubic-bezier(.2,1.2,.4,1)}
.conf .tick circle{stroke:var(--accent)} .conf .tick path{stroke:var(--accent);stroke-dasharray:24;stroke-dashoffset:24;animation:draw .4s .1s ease-out forwards}
.conf.full .tick circle,.conf.full .tick path{stroke:var(--good)}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes slideup{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
@keyframes cpop{from{transform:scale(.55)}to{transform:scale(1)}}
.prings{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
.pring{background:none;border:none;border-radius:16px;padding:8px 0 10px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--text);min-width:0}
.pring.sel{background:var(--accent-bg)}
.pr-ring{position:relative;width:58px;height:58px;margin-bottom:4px}
.pr-n{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk',sans-serif;font-size:18px;font-weight:700}
.pr-name{font-size:12px;font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pr-sub{font-size:11px;color:var(--muted)}
.swapbtn{width:36px;height:36px;border-radius:18px;border:none;background:transparent;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;margin-right:-8px}
.swapbtn:active{background:var(--card)}
.swapopt{display:flex;gap:12px;align-items:center;width:100%;padding:12px 0;border:none;border-bottom:1px solid var(--line);background:none;color:var(--text)}
.xr.swapin{animation:swapin .45s cubic-bezier(.2,1.2,.4,1)}
@keyframes swapin{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
.tsearch{flex:1;min-width:0;display:flex;align-items:center;gap:8px;height:42px;padding:0 6px 0 14px;border-radius:12px;background:var(--card)}
.tsearch input{flex:1;min-width:0;height:42px;border:none;background:transparent;color:var(--text);font-size:16px;outline:none;-webkit-appearance:none}
.tsearch input::-webkit-search-cancel-button{display:none}
.tsearch:focus-within{box-shadow:0 0 0 2px var(--accent)}
.tq-x{width:32px;height:32px;border-radius:16px;border:none;background:#2E2740;color:var(--soft);font-size:18px;line-height:1;flex-shrink:0}
#tres:not(:empty){margin-top:4px;padding:0 2px}
.sr{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.sr .ico{border:none;padding:0}
.sr-main{flex:1;min-width:0;background:none;border:none;color:var(--text);text-align:left;padding:4px 0;display:flex;flex-direction:column;gap:2px}
.sr-name{font-size:15px;font-weight:600}
.sr-log{height:40px;min-width:72px;padding:0 12px;border-radius:20px;border:1.5px solid var(--accent);background:transparent;color:var(--accent);font-size:14px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .2s,color .2s}
.sr-log.ok{background:var(--accent);color:var(--accent-ink);animation:cpop .4s cubic-bezier(.2,1.6,.4,1)}
.loghead{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:var(--muted);padding:24px 0 8px;border-bottom:1px solid var(--line)}
.loghead span:first-child{font-size:15px;font-weight:600;color:var(--text)}
.lrow{display:flex;align-items:center;gap:12px;width:100%;padding:10px 0;border:none;border-bottom:1px solid var(--line);background:none;color:var(--text);text-align:left;min-height:52px}
.lname{flex:1;min-width:0;font-size:14px;font-weight:500}
.lchips{display:flex;gap:4px;flex-wrap:wrap;align-items:center;justify-content:flex-end;flex-shrink:0;max-width:55%}
.lchip{min-width:28px;height:24px;padding:0 7px;border-radius:12px;background:#2A2436;color:var(--soft);font-size:12px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.lchip.ghost{background:none;box-shadow:inset 0 0 0 1.5px #3A3249}
.lkg{font-size:12px;color:var(--muted);margin-left:4px;white-space:nowrap}
.logrow{display:grid;grid-template-columns:44px minmax(0,1fr);column-gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
.logrow .lt{color:var(--muted);font-variant-numeric:tabular-nums;grid-row:span 2}
.logrow .ln{color:var(--text);font-weight:500}
.logrow .ld{color:var(--muted);font-size:12px;margin-top:1px}
.xr-c{display:flex;align-items:center;gap:12px;width:100%;padding:10px 0;border:none;border-bottom:1px solid var(--line);background:none;color:var(--muted);font-size:14px;text-align:left}
.grp{width:100%;display:flex;justify-content:space-between;align-items:center;padding:14px 0;border:none;border-bottom:1px solid var(--line);background:none;color:var(--text);text-align:left;min-height:56px}
.grp-body{padding-left:4px}
.rest{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom));z-index:6;padding:0 12px 10px}
.rest .in{max-width:456px;margin:0 auto;background:#241F2F;border:1px solid #2E2740;border-radius:18px;padding:12px 14px}
.rclock{font-family:'Space Grotesk',sans-serif;font-size:28px;font-weight:700;min-width:64px}
.rbtn{height:36px;min-width:44px;padding:0 10px;border-radius:10px;border:none;background:#2E2740;color:var(--soft);font-size:14px;font-weight:600}
.ef{width:36px;height:36px;border-radius:18px;border:none;background:#2E2740;color:var(--soft);font-size:13px;font-weight:600;flex-shrink:0}
.ef.on{background:var(--accent);color:var(--accent-ink)}
body.resting .app{padding-bottom:calc(env(safe-area-inset-bottom) + 170px)}
.toast{bottom:auto !important;top:calc(env(safe-area-inset-top) + 14px)}
.bar>i{transition:width .8s cubic-bezier(.2,.8,.2,1)}
.rg{transition:stroke-dasharray .9s cubic-bezier(.2,.8,.2,1)}
.toast{display:flex;align-items:center;gap:14px}
.toast.good{background:#7FD1A8;color:#0E2A1C}
.toast.pb{background:#FFB08A;color:#2A1208}
.toast button{background:none;border:none;font-weight:700;font-size:14px;color:inherit;text-decoration:underline;padding:4px 0}
.cel{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.6);overflow:hidden;animation:fade .2s ease-out}
.cel .box{position:relative;background:#1B1724;border-radius:28px;padding:28px 26px;text-align:center;max-width:300px;animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
.cel .box h3{margin:14px 0 6px;font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700}
.cel .box p{margin:0;color:var(--soft);font-size:14px;line-height:1.45}
.cf{position:absolute;top:-16px;width:8px;height:14px;border-radius:2px;animation:fall 2.2s cubic-bezier(.3,.1,.6,1) forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:6px 11px;border-radius:12px;background:#3A2622;color:#F7C873}
.tip{display:flex;gap:12px;align-items:center;background:var(--card);border-radius:16px;padding:12px 14px;font-size:13px;color:var(--soft);line-height:1.45}
.tip button{background:none;border:none;color:var(--muted);font-size:18px;padding:4px 8px;min-width:36px;min-height:36px}
.stat{background:var(--card);border-radius:16px;padding:12px 14px}
.stat b{display:block;font-family:'Space Grotesk',sans-serif;font-size:26px}
.stat span{font-size:12px;color:var(--muted)}
.ico{width:44px;height:44px;border-radius:13px;background:var(--card);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ico.sm{width:30px;height:30px;border-radius:9px}
.ico.big{width:96px;height:96px;border-radius:26px}
.afilt{display:flex;gap:6px;overflow-x:auto;margin:10px -20px 0;padding:2px 20px 4px;scrollbar-width:none}
.afilt::-webkit-scrollbar{display:none}
.afilt .lc{flex-shrink:0}
.wpC{display:flex;gap:6px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.wpC button{flex:1;min-width:0;height:34px;border-radius:10px;border:none;background:#231E2E;color:var(--text);font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:5px;font-variant-numeric:tabular-nums}
.wpC button b{font-size:10px}
.wpC button.done{color:#7FD1A8}
.wpC button.sel{background:#F4EFF8;color:#120F18}
/* v4 */
.seg button.on,.effort button.on,.sides button.on,.lc.on,.ef.on{background:#F4EFF8;color:#120F18}
.btn{background:#F4EFF8;color:#120F18}

// rough time per set, in seconds, including moving between sets

const P = [

// ---------- Custom exercises (yours, saved on this phone) ----------
const GENERIC_ICON = [32,13,'M32 19 V37 M32 37 L26 53.5 M32 37 L38 53.5','M32 24 L20 30 M32 24 L44 30',''];
let customs = []; try { customs = JSON.parse(localStorage.getItem('atg-custom') || '[]') || []; } catch(e){ customs = []; }
function customRx(c){ const side = c.s ? '/side' : ''; return c.sets+' × '+(c.k === 'reps' ? c.r+side : c.k === 'time' ? (c.t >= 60 && c.t % 60 === 0 ? (c.t/60)+' min' : c.t+'s')+side : 'max'+side); }
function applyCustoms(){

    const v = items.length > 1 ? i / (items.length - 1) : 0;
    if (POS[id] === undefined || v < POS[id]) POS[id] = v;

async function writeWeek(k, retry){
  const ref = cloudCol().doc('w-'+k);
  const ls = logs.filter(l => weekKey(l.date) === k);
  try { if (ls.length) await ref.set({logs:ls}); else await ref.delete(); cloud.status = 'cloud'; }
  catch(e){
    const code = e && e.code;
    if (code === 'unavailable' && !retry) { await new Promise(r => setTimeout(r, 800+Math.random()*800)); return writeWeek(k, true); }
    cloud.status = code === 'quota_exceeded' ? 'full' : 'error';
  }
  if (st.tab === 'protocols') render();
}
function syncWeeks(keys){
  if (!cloud.db) return;

async function initCloud(){
  try {
    if (!window.claude || !window.claude.use) return;
    const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    if (!db || !user) return;
    const uid = await user.id(); if (!uid) return;
    cloud.db = db; cloud.uid = uid; cloud.status = 'loading'; render();
    const snap = await Promise.race([cloudCol().get(), new Promise((_, rej) => setTimeout(() => rej({code:'timeout'}), 10000))]);
    const remote = []; snap.docs.forEach(d => { const b = d.data(); if (b && Array.isArray(b.logs)) b.logs.forEach(l => remote.push(l)); });
    const have = new Set(remote.map(l => l.id));
    const unsynced = logs.filter(l => !have.has(l.id));
    logs = remote.concat(unsynced).filter(l => l && l.ex && E[l.ex]).sort((a,b) => a.ts-b.ts);
    save(); cloud.status = 'cloud'; render(); if (st.sheet) renderSheet();

}

function computeWeek(){
  const now = new Date(); const today = dkey(now); const ws = dkey(weekStart(now));
  const wk = {}; const tdy = {}; const last = {}; const perDay = [0,0,0,0,0,0,0]; const wkDays = {}; const tl = {};
  logs.forEach(l => {
    if (!last[l.ex] || l.date > last[l.ex]) last[l.ex] = l.date;
    if (l.date >= ws) { wk[l.ex] = (wk[l.ex]||0)+1; (wkDays[l.ex] = wkDays[l.ex] || {})[l.date] = 1; const di = daysBetween(ws, l.date); if (di>=0 && di<7) perDay[di]++; }
    if (l.date === today) { tdy[l.ex] = (tdy[l.ex]||0)+1; (tl[l.ex] = tl[l.ex] || []).push(l); }
  });
  const ex = Object.keys(E).filter(id => !E[id].hidden).map(id => {
    const t = T[id]; const d = wk[id]||0;
    const since = last[id] ? daysBetween(last[id], today) : null;
    return {id, name:E[id].n, area:E[id].a, equip:E[id].q, kind:E[id].k, target:t.target, done:d, left:Math.max(0,t.target-d), since,
      tags:ORDER.filter(p => t.by[p] !== undefined), optional:t.target===0,
      ideal:t.ideal.text, times:t.ideal.times, workouts:Math.min(t.ideal.times || 99, Object.keys(wkDays[id]||{}).length)};
  });
  const prot = {};
  P.forEach(p => { let tt=0, dd=0; p.items.forEach(([e,w]) => { tt+=w; dd+=Math.min(wk[e]||0, w); }); prot[p.id] = {t:tt, d:dd}; });
  let target=0, done=0; ex.forEach(x => { target += x.target; done += Math.min(x.done, x.target); });
  return {ex, prot, target, done, perDay, today, ws, tdy, wk, tl, todayIdx:(new Date().getDay()+6)%7};
}

function dayState(today){
  let d = readJSON('atg-day', null);
  if (!d || d.date !== today) { d = {date:today, batch:0, ended:false, added:[]}; writeJSON('atg-day', d); }
  d.added = d.added || []; d.ab = d.ab || {};
  return d;
}
function saveDay(d){ writeJSON('atg-day', d); }
function todayMinutes(W){ let s = 0; Object.keys(W.tl).forEach(id => { s += W.tl[id].length * setTime(id); }); return Math.max(1, Math.round(s/60)); }
function shareOf(x, W){ const per = T[x.id].ideal.per || 1; const td = W.tdy[x.id] || 0; return x.optional ? Math.max(per, td) : Math.min(per, x.left + td); }
function itemDone(x, W){ const sh = shareOf(x, W); return sh === 0 || (W.tdy[x.id] || 0) >= sh; }

function buildQueue(W, match){
  const per = id => T[id].ideal.per || 1;
  const sinceN = x => x.since === null ? 99 : x.since;
  const fkey = [st.prot, st.equip, W.today, prioKey()].join('|');
  if (!st.up) { const saved = readJSON('atg-up', null); if (saved && saved.key === fkey && Array.isArray(saved.ids)) st.up = saved; }
  if (st.up && st.up.key === fkey) return st.up.ids;
  const skipped = skippedToday(W.today);
  const inProg = x => (W.tdy[x.id]||0) > 0 && (W.tdy[x.id]||0) < per(x.id);
  const spaced = x => x.since === 1 && T[x.id].ideal.times <= 3 && !inProg(x);
  const ids = W.ex.filter(x => match(x) && !x.optional && x.left > 0 && (W.tdy[x.id]||0) < per(x.id) && skipped.indexOf(x.id) === -1)
    .sort((a,b) => (inProg(b) - inProg(a)) || (prioOf(b.id) - prioOf(a.id)) || (spaced(a) - spaced(b)) ||
      (b.left/b.target - a.left/a.target) || (sinceN(b) - sinceN(a)) || (b.left - a.left))
    .slice(0, 18).map(x => x.id);
  st.up = {key:fkey, ids}; writeJSON('atg-up', st.up);
  return ids;
}
function batchesOf(ids){ const out = []; for (let i = 0; i < ids.length; i += 3) out.push(ids.slice(i, i+3).sort(byPos)); return out; }

function weekProt(W){
  return '<div class="wpC">'+P.map(p => { const x = W.prot[p.id]; const left = Math.max(0, x.t - x.d); const sel = st.prot === p.id;
    return '<button class="'+(sel?'sel':'')+(left?'':' done')+'" aria-pressed="'+sel+'" aria-label="'+esc(p.name)+': '+(left ? left+' sets left' : 'done')+'. Tap to filter" data-a="prot" data-v="'+esc(p.id)+'"><b style="color:'+(sel ? '#120F18' : TAGC[p.id])+'">'+TAGL[p.id]+'</b>'+(left || '✓')+'</button>'; }).join('')+'</div>';
}
function viewToday(W){
  const now = new Date(); const ws = weekStart(now);
  const pct = W.target ? Math.round(W.done/W.target*100) : 0;
  const ds = dayState(W.today);
  const c64 = 2*Math.PI*26;
  const maxDay = Math.max(10, ...W.perDay);
  let h = '<div class="dateline">'+DAYFULL[W.todayIdx]+' '+now.getDate()+' '+MON[now.getMonth()]+'</div>';
  h += '<div class="wcard"><div class="row-between" style="align-items:center">'+
    '<div><div class="bignum">'+(W.target-W.done)+'</div><div class="small" style="color:var(--soft);margin-top:6px;font-size:13px">sets left this week · '+W.done+' of '+W.target+' done</div></div>'+
    '<div style="position:relative;width:64px;height:64px;flex-shrink:0"><svg role="img" aria-label="'+pct+' percent done" width="64" height="64" viewBox="0 0 64 64"><circle cx="32" cy="32" r="26" fill="none" stroke="#2A2436" stroke-width="6"/><circle cx="32" cy="32" r="26" fill="none" stroke="#FFB08A" stroke-width="6" stroke-linecap="round" class="rg" data-k="ring" data-p="strokeDasharray" data-to="'+Math.round(c64*pct/100)+' '+Math.round(c64)+'" transform="rotate(-90 32 32)"/></svg><span style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600">'+pct+'%</span></div></div>'+
    '<div class="dbars">'+DAYN.map((d,i) => { const dd = new Date(ws); dd.setDate(dd.getDate()+i); const k = dkey(dd); const future = i > W.todayIdx; const n = W.perDay[i];
      return '<button class="dbar'+(i===W.todayIdx?' today':'')+'" '+(future?'disabled ':'')+'aria-label="'+DAYN[i]+' '+dd.getDate()+' '+MON[dd.getMonth()]+': '+n+' sets" data-a="day" data-v="'+k+'"><span class="dcol"><i style="height:'+(n ? Math.max(6, Math.round(n/maxDay*34)) : 4)+'px'+(n?'':';background:#2A2436')+'"></i></span>'+d[0]+'</button>'; }).join('')+'</div>'+
    weekProt(W)+streakChip()+'</div>';
  if (!storageOk) h += '<div class="note warn" style="margin-top:16px">This browser isn\'t letting the app save. Sets you log will be lost when you close it.</div>';
  h += wrapCard();

  // search and Home/Gym, sticky while you scroll
  const anyF = st.prot || st.equip!=='All';
  const match = x => (!st.prot || x.tags.indexOf(st.prot)!==-1) && (st.equip==='All' || x.equip===st.equip);
  h += '<div class="tbar"><div class="tsearch"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8B819A" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>'+
    '<label for="tq" class="hidden">Find an exercise to log</label><input id="tq" type="search" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Find an exercise" value="'+esc(st.tq)+'">'+
    (st.tq ? '<button class="tq-x" aria-label="Clear search" data-a="tq-clear">×</button>' : '')+'</div>'+
    '<div class="seg" role="group" aria-label="Equipment">'+['All','Home','Gym'].map(e => '<button class="'+(st.equip===e?'on':'')+'" aria-pressed="'+(st.equip===e)+'" data-a="equip" data-v="'+e+'">'+e+'</button>').join('')+'</div></div>';
  if (st.prot) h += '<div class="row-between small" style="margin-top:8px"><span class="muted">Showing '+esc(P.find(p => p.id === st.prot).name)+' only</span><button class="linkbtn" style="padding:0;min-height:30px;font-size:13px" data-a="clear">Show everything</button></div>';
  h += '<div id="tres"></div>';

  // the day's queue, served three at a time
  const queue = buildQueue(W, match);
  const chunks = batchesOf(queue);
  const b = Math.min(ds.batch, chunks.length);
  const find = id => W.ex.find(x => x.id === id) || (E[id] ? computeOne(id, W) : null);
  let cur = (chunks[b] || []).slice();
  const ab = id => ds.ab[id] === undefined ? b : Math.min(ds.ab[id], b);
  ds.added.forEach(id => { if (ab(id) === b && cur.indexOf(id) === -1 && !chunks.slice(0, b).some(ch => ch.indexOf(id) !== -1) && E[id] && !E[id].hidden) cur.push(id); });
  const curX = cur.map(find).filter(Boolean);
  const prevX = chunks.slice(0, b).flat().concat(ds.added.filter(id => ab(id) < b && E[id] && !E[id].hidden)).map(find).filter(Boolean);
  const nextIds = (chunks[b+1] || []).filter(id => !itemDone(find(id), W));
  const curDone = curX.length > 0 && curX.every(x => itemDone(x, W));
  const remSets = curX.reduce((s,x) => s + Math.max(0, shareOf(x, W) - (W.tdy[x.id]||0)), 0);
  const remMin = Math.max(1, Math.round(curX.reduce((s,x) => s + Math.max(0, shareOf(x, W) - (W.tdy[x.id]||0)) * setTime(x.id), 0) / 60));
  const setsToday = Object.keys(W.tl).reduce((s,id) => s + W.tl[id].length, 0);
  const prevSets = prevX.reduce((s,x) => s + Math.min(W.tdy[x.id]||0, shareOf(x, W)), 0);
  const nextMin = Math.max(1, Math.round(nextIds.reduce((s,id) => { const x = find(id); return s + shareOf(x, W) * setTime(id); }, 0) / 60));
  const addBtn = (label) => '<button class="addtoday" data-a="add-open">'+label+'</button>';

  h += '<div class="section">';
  if (ds.ended) {
    // D4 · done for today
    h += '<button class="donecard" data-a="day" data-v="'+W.today+'"><svg aria-hidden="true" width="40" height="40" viewBox="0 0 40 40"><circle cx="20" cy="20" r="17" fill="none" stroke="#7FD1A8" stroke-width="3"/><path d="M12.5 20.5l5 5 10-11" fill="none" stroke="#7FD1A8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>'+
      '<span style="flex:1;text-align:left"><span style="display:block;font-size:15px;font-weight:600;color:#E6F7EE">Done for today · '+setsToday+' sets</span><span style="display:block;font-size:12px;color:#9FD9BC;margin-top:2px">Tap to see what you did</span></span></button>';
    const tmr = W.ex.filter(x => match(x) && !x.optional && x.left > 0 && !(W.tdy[x.id] > 0) && !(x.since === 1 && T[x.id].ideal.times <= 3))
      .sort((a,b2) => (prioOf(b2.id) - prioOf(a.id)) || (b2.left/b2.target - a.left/a.target) || ((b2.since===null?99:b2.since) - (a.since===null?99:a.since))).slice(0,3).map(x => x.id).sort(byPos);
    if (tmr.length) h += '<div class="lbl2">Tomorrow\'s first 3</div>'+tmr.map(id => '<div class="xr-c" style="cursor:default"><span style="width:26px;opacity:.6;display:flex">'+icon(id,26)+'</span><span style="flex:1">'+esc(E[id].n)+'</span><span class="small muted">'+esc(T[id].ideal.rx)+'</span></div>').join('')+
      '<p class="small muted" style="margin:10px 0 0;line-height:1.5">This changes if you log more today, and it\'s spaced so nothing repeats two days running.</p>';
    h += '<button class="linkbtn" style="margin-top:6px" data-a="day-resume">Changed your mind? Keep going</button>';
  } else if (!curX.length) {
    h += '<h2>Today</h2><div class="card" style="margin-top:12px;font-size:14px;color:var(--soft);line-height:1.5">'+(W.target - W.done > 0 ? 'Nothing else is due'+(anyF ? ' for this filter' : '')+' today. Everything left this week was done recently, so it\'s spaced out for later.' : 'Every minimum is hit this week. Nice work.')+'</div>'+addBtn('+ Add something to today');
  } else if (curDone) {
    if (b === 0 && nextIds.length) {
      // D1 · first batch done: the offer
      h += '<h2 style="font-size:20px">'+curX.length+' done. Nice.</h2><div class="small muted" style="margin-top:3px">'+setsToday+' sets · '+todayMinutes(W)+' minutes</div>'+
        '<div class="wprog"><i style="flex:1;background:#7FD1A8"></i></div>'+curX.map(x => rowDone(x, (W.tdy[x.id]||0)+' sets ✓')).join('')+
        '<div class="offer"><div class="offer-k">You\'re warm. While you\'re here…</div><div class="offer-t">'+nextIds.length+' more, about '+nextMin+' minute'+(nextMin>1?'s':'')+'</div>'+
        '<div class="offer-ic">'+nextIds.map(id => '<div><span>'+icon(id,40)+'</span><em>'+esc(E[id].n)+'</em></div>').join('')+'</div>'+
        '<button class="btn" data-a="batch-next">Keep going</button><button class="btn quiet" data-a="day-end">That\'s enough for today</button></div>';
    } else {
      // D3 · a solid session
      const weekPct = W.target ? Math.round(setsToday / W.target * 100) : 0;
      const half = P.filter(p => { const v = W.prot[p.id]; return v.t && v.d / v.t >= 0.5 && v.d < v.t && Object.keys(W.tl).some(id => T[id].by[p.id] !== undefined); })[0];
      const full = P.filter(p => { const v = W.prot[p.id]; return v.t && v.d >= v.t && Object.keys(W.tl).some(id => T[id].by[p.id] > 0); })[0];
      h += '<h2 style="font-size:20px">Solid session</h2><div class="small muted" style="margin-top:3px">'+Object.keys(W.tl).length+' exercises · '+setsToday+' sets · '+todayMinutes(W)+' minutes</div>'+
        '<div class="wprog"><i style="flex:1;background:#7FD1A8"></i></div>'+
        '<div class="celebcard"><svg aria-hidden="true" width="56" height="56" viewBox="0 0 64 64"><circle cx="32" cy="32" r="27" fill="none" stroke="#7FD1A8" stroke-width="5"/><path d="M20 33l8 8 16-17" fill="none" stroke="#7FD1A8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>'+
        '<div style="font-size:19px;font-weight:600;margin-top:10px;color:#E6F7EE">'+setsToday+' sets in '+todayMinutes(W)+' minutes</div>'+
        '<div style="font-size:13px;color:#9FD9BC;margin-top:6px;line-height:1.5">That\'s '+weekPct+'% of your week in one go.'+(full ? '<br>'+esc(full.name)+' is done for the week.' : half ? '<br>'+esc(half.name)+' is now more than half done.' : '')+'</div></div>'+
        prevX.concat(curX).map(x => rowDone(x, (W.tdy[x.id]||0)+' sets ✓')).join('')+
        '<div class="grid2" style="margin-top:14px"><button class="btn" style="height:50px" data-a="day-end">Done for today</button>'+(nextIds.length ? '<button class="btn ghost" style="height:50px" data-a="batch-next">'+nextIds.length+' more</button>' : '<button class="btn ghost" style="height:50px" data-a="add-open">Add more</button>')+'</div>';
    }
  } else {
    // a batch in progress
    const n = curX.length;
    const title = b === 0 ? (n === 1 ? 'Just start with this one' : 'Just start with these '+n) : (n === 1 ? 'One more' : n+' more');
    h += '<div class="row-between" style="align-items:flex-end"><div><h2 style="font-size:20px">'+title+'</h2><div class="small muted" style="margin-top:3px">'+remSets+' set'+(remSets!==1?'s':'')+' to go · about '+remMin+' minute'+(remMin>1?'s':'')+'</div></div></div>';
    const curShare = curX.reduce((s,x) => s + shareOf(x, W), 0); const curDoneSets = curX.reduce((s,x) => s + Math.min(W.tdy[x.id]||0, shareOf(x, W)), 0);
    h += '<div class="wprog">'+(prevSets ? '<i style="flex:'+prevSets+';background:#7FD1A8"></i>' : '')+(curDoneSets ? '<i style="flex:'+curDoneSets+';background:#FFB08A"></i>' : '')+'<i style="flex:'+Math.max(0.0001, curShare - curDoneSets)+';background:#2A2436"></i></div>';
    if (b > 0) h += '<button class="prevbar" data-a="prev-toggle"><span>'+(b === 1 ? 'First '+prevX.length : prevX.length)+' done · '+prevSets+' sets</span><span>'+(st.showPrev ? 'Hide' : 'Show')+'</span></button>'+(st.showPrev ? prevX.map(x => rowDone(x, (W.tdy[x.id]||0)+' sets ✓')).join('') : '');
    if (!flag('tip-circles')) h += '<div class="tip" style="margin:12px 0 4px"><span class="cc on" style="width:30px;height:30px;font-size:12px;flex-shrink:0" aria-hidden="true">8</span><span style="flex:1">Tap a circle to log a set. Tap a filled one to take a rep off, or hold it to delete. Tap ··· to swap, remove or change the weight.</span><button aria-label="Dismiss tip" data-a="tip-off">×</button></div>';
    h += curX.map(x => row(x, W)).join('');
    h += addBtn(n < 3 ? '+ Add one to make it 3' : '+ Add to today');
    if (false) h += '<div class="nextcard"><div><div style="font-size:14px;font-weight:600;color:var(--soft)">On a roll? '+nextIds.length+' more ready</div><div class="small muted" style="margin-top:2px">'+esc(nextIds.map(id => E[id].n).join(', '))+' · ~'+nextMin+' min</div></div></div>';
  }
  h += '</div>';

  // This week: protocol rings, then everything else grouped by protocol
  h += '<div class="section"><h2 style="font-size:18px;margin-bottom:4px">Everything else this week</h2>';
  const inToday = new Set(curX.map(x => x.id));
  P.filter(p => !st.prot || p.id === st.prot).forEach(p => {
    const v = W.prot[p.id];
    const xs = p.items.map(i => i[0]).filter(id => !inToday.has(id) && E[id] && !E[id].hidden).map(id => W.ex.find(e => e.id === id)).filter(x => x && match(x));
    if (!xs.length) return;
    const open = !!st.open[p.id] || st.prot === p.id;
    h += '<button class="grp" aria-expanded="'+open+'" data-a="grp" data-v="'+esc(p.id)+'"><span style="display:flex;align-items:center;gap:8px"><span style="font-size:15px;font-weight:500">'+esc(p.name)+'</span></span>'+
      '<span class="small muted" style="display:flex;align-items:center;gap:8px">'+xs.length+' exercise'+(xs.length>1?'s':'')+' · '+Math.max(0, v.t-v.d)+' sets left<svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8B819A" stroke-width="2.4" stroke-linecap="round" style="transition:transform .2s;transform:rotate('+(open?180:0)+'deg)"><path d="M6 9l6 6 6-6"/></svg></span></button>';
    if (open) {
      const active = xs.filter(x => x.optional || x.left > 0).sort((a,b2) => (a.optional-b2.optional) || byPos(a.id, b2.id));
      const done = xs.filter(x => !x.optional && x.left === 0);
      h += '<div class="grp-body">'+active.map(x => row(x, W)).join('')+done.map(x => rowDone(x)).join('')+'</div>';
    }
  });
  h += '</div>';
  return h;
}
// a stand-in week entry for something not in the main list (e.g. a hidden custom)
function computeOne(id, W){ const t = T[id]; const d = W.wk[id] || 0; return {id, name:E[id].n, area:E[id].a, equip:E[id].q, kind:E[id].k, target:t.target, done:d, left:Math.max(0,t.target-d), since:null, tags:ORDER.filter(p => t.by[p] !== undefined), optional:t.target===0, ideal:t.ideal.text, times:t.ideal.times, workouts:0}; }

// ---------- ··· menu ----------
function inCurrentBatch(id){
  const W = computeWeek(); const ds = dayState(W.today); if (ds.ended || !st.up) return false;
  const chunks = batchesOf(st.up.ids); const b = Math.min(ds.batch, chunks.length); const cur = (chunks[b] || []).concat(ds.added.filter(z => (ds.ab[z] === undefined ? b : ds.ab[z]) >= b));
  return cur.indexOf(id) !== -1;
}
function openMenu(id, view){ st.menu = {id, view:view || 'main', confirm:false}; renderMenu(); }
function closeMenu(){ st.menu = null; renderMenu(); }

  let h = '<div class="sheet-bg" data-a="menu-bg"><div class="sheet" role="dialog" aria-modal="true" aria-label="'+esc(e.n)+' options"><div class="grab"></div>'+

      '<div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:12px">'+[0,2.5,5,7.5,10,12.5,15,20,25].map(v => '<button class="lc'+(v===w?' on':'')+'" data-a="ld-set" data-v="'+id+':'+v+'">'+(v?v:'None')+'</button>').join('')+'</div>'+
      (stale ? '<button class="btn ghost" style="height:44px;font-size:14px;margin-top:14px" data-a="ld-apply" data-v="'+id+'">Also set today\'s '+stale+' set'+(stale>1?'s':'')+' to '+(w?kg(w):'no weight')+'</button>' : '')+
      '<button class="btn" style="margin-top:14px" data-a="menu-close">Done</button>';
  } else {
    h += '<div class="mlist">';
    if (inW) h += item('swap', 'Swap for today', 'Same area, still due', '⇄');
    if (e.l) h += item('menu-weight', 'Change weight', '', curLoad(id) ? kg(curLoad(id)) : 'None');
    h += item('menu-sheet', 'Timer, effort and history', '', '›');
    if (inW) h += item('menu-remove', 'Remove from today', 'Stays in this week\'s target', '', 'danger');
    if (e.custom) h += st.menu.confirm ? '<div class="note warn" style="margin-top:8px">Hide '+esc(e.n)+'? It disappears from lists and targets. Sets you\'ve logged stay in your history.</div><div class="grid2" style="margin-top:8px"><button class="btn ghost" style="height:44px" data-a="menu-close">Cancel</button><button class="btn danger" style="height:44px" data-a="cust-hide" data-v="'+id+'">Hide it</button></div>'
      : item('cust-hide-ask', 'Delete this custom exercise', 'Keeps the sets you\'ve logged', '', 'danger');

function removeToday(id){
  const today = dkey(new Date()); const ds = dayState(today);
  const idx = st.up ? st.up.ids.indexOf(id) : -1;
  if (idx !== -1) { st.up.ids.splice(idx, 1); writeJSON('atg-up', st.up); }
  const ai = ds.added.indexOf(id); if (ai !== -1) { ds.added.splice(ai, 1); saveDay(ds); }
  const sk = skippedToday(today); if (sk.indexOf(id) === -1) sk.push(id); writeJSON('atg-skip', {date:today, ids:sk});
  lastRemoved = {id, idx, added: ai !== -1};
  closeMenu(); render(); toast('Removed from today', {undoRemove:true});
}
let lastRemoved = null;
function undoRemove(){
  if (!lastRemoved) return; const today = dkey(new Date()); const r = lastRemoved; lastRemoved = null;
  if (r.idx !== -1 && st.up) { st.up.ids.splice(r.idx, 0, r.id); writeJSON('atg-up', st.up); }
  if (r.added) { const ds = dayState(today); ds.added.push(r.id); saveDay(ds); }
  const sk = skippedToday(today).filter(z => z !== r.id); writeJSON('atg-skip', {date:today, ids:sk});
  st.swapIn = r.id; render(); setTimeout(() => { st.swapIn = null; }, 600); toast('Back on today\'s list');
}

// ---------- Add to today, and custom exercises ----------
function openAdd(){ st.add = {q:'', view:'list', err:'', area:'All', eq:st.equip, f:{n:'', k:'reps', sets:3, r:10, t:30, s:false, l:false, q:st.equip === 'Gym' ? 'Gym' : 'Home', prot:null}}; renderAdd(); }
function closeAdd(){ st.add = null; document.getElementById('add-root').innerHTML = ''; }
function curBatchSet(){ const W = computeWeek(); const ds = dayState(W.today); const ids = st.up ? st.up.ids : []; const ch = batchesOf(ids); const b = Math.min(ds.batch, ch.length);
  return new Set((ch[b] || []).concat(ds.added).filter(id => !(ds.ended))); }
function addMatch(id){ const a = st.add; return (a.eq === 'All' || E[id].q === a.eq) && (a.area === 'All' || E[id].a === a.area); }
function addCandidates(W){
  const busy = curBatchSet();
  return W.ex.filter(x => !x.optional && x.left > 0 && !busy.has(x.id) && !(W.tdy[x.id] > 0) && addMatch(x.id))
    .sort((a,b) => (prioOf(b.id) - prioOf(a.id)) || (b.left/b.target - a.left/a.target) || ((b.since===null?99:b.since) - (a.since===null?99:a.since)));

    return {date:d, n:ls.length, effort: ef.length ? ef.reduce((a,b)=>a+b,0)/ef.length : null,
      load: Math.max(...ls.map(l => l.load||0)), reps: Math.max(...ls.map(l => l.reps||0)), secs: Math.max(...ls.map(l => l.secs||0))};

let actx = null;

// ---------- Weeks, streaks, bests ----------
const flame = '<svg aria-hidden="true" width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2c1 4-3 6-3 10a3 3 0 0 0 6 0c0-1.5-.7-2.6-1-3.5 2.5 1.4 4 3.9 4 6.5a6 6 0 0 1-12 0C6 9.5 10 7 12 2z"/></svg>';
function weekCounts(){ const m = {}; logs.forEach(l => { const k = weekKey(l.date); const w = m[k] = m[k] || {}; w[l.ex] = (w[l.ex]||0)+1; }); return m; }
function protMet(c, p){ let t = 0, d = 0; p.items.forEach(([e,w]) => { t += w; d += Math.min((c && c[e]) || 0, w); }); return t > 0 && d >= t; }
function allMet(c){ return P.every(p => protMet(c, p)); }
function streakInfo(test){
  const wc = weekCounts(); const cur = weekStart(new Date());
  let n = 0; const d = new Date(cur);
  if (test(wc[dkey(d)])) n++;
  for (let i = 0; i < 520; i++) { d.setDate(d.getDate()-7); if (test(wc[dkey(d)])) n++; else break; }
  let best = 0, run = 0;
  if (logs.length) { const w = weekStart(new Date(logs.reduce((a,l) => l.date < a ? l.date : a, logs[0].date)+'T12:00:00'));
    while (w <= cur) { if (test(wc[dkey(w)])) { run++; best = Math.max(best, run); } else run = 0; w.setDate(w.getDate()+7); } }
  return {cur:n, best:Math.max(best, n)};
}
function streakChip(){
  const a = streakInfo(allMet);
  if (a.cur) return '<div style="margin-top:12px"><span class="chip">'+flame+a.cur+'-week streak · every minimum</span></div>';
  let top = null; P.forEach(p => { const s = streakInfo(c => protMet(c, p)); if (s.cur && (!top || s.cur > top.n)) top = {n:s.cur, name:short(p.id)}; });
  return top ? '<div style="margin-top:12px"><span class="chip">'+flame+esc(top.name)+' · '+top.n+'-week streak</span></div>' : '';
}
function score(l){ const k = E[l.ex].k; if (k === 'dist') return -1; if (k === 'time' || k === 'fail') return l.secs||0; return (l.load||0)*1000 + (l.reps||0); }
function pbFor(entry, pool){
  if (E[entry.ex].k === 'dist') return null;
  const earlier = pool.filter(l => l.ex === entry.ex && l.ts < entry.ts); if (!earlier.length) return null;
  const best = earlier.reduce((a,l) => score(l) > score(a) ? l : a, earlier[0]);
  return score(entry) > score(best) ? {prev:best, now:entry} : null;
}

// ---------- Logging with celebration ----------
function commitLog(entry, o){
  // anything logged today shows in today's list
  if (entry.date === dkey(new Date()) && joinToday(entry.ex)) { st.swapIn = entry.ex; setTimeout(() => { if (st.swapIn === entry.ex) st.swapIn = null; }, 600); }
  const before = computeWeek(); const pb = pbFor(entry, logs);
  logs.push(entry); save(); syncWeeks([weekKey(entry.date)]);
  const after = computeWeek();
  const xb = before.ex.find(z => z.id === entry.ex), xa = after.ex.find(z => z.id === entry.ex);
  const hit = P.filter(p => before.prot[p.id].d < before.prot[p.id].t && after.prot[p.id].d >= after.prot[p.id].t);
  if (before.done < before.target && after.done >= after.target) {
    feedback('big'); celebrate('Every minimum hit', 'That\'s the whole week done. '+streakInfo(allMet).cur+'-week streak.');
  } else if (hit.length) {
    feedback('big'); const p = hit[0]; const s = streakInfo(c => protMet(c, p)).cur;
    celebrate(p.name+' done for the week', 'All '+after.prot[p.id].t+' minimum sets hit'+(s > 1 ? ' · '+s+'-week streak' : '')+'.');
  } else if (pb) {
    feedback('pb'); toast('New best · '+E[entry.ex].n+' '+describe(pb.now)+' (was '+describe(pb.prev)+')', {kind:'pb', undo:entry.id});
  } else if (!xa.optional && xb.left > 0 && xa.left === 0) {
    feedback('good'); toast(E[entry.ex].n+' done for the week', {kind:'good', undo:entry.id});
  } else if (o && o.quiet) {
    feedback('good');
  } else {
    feedback('good'); toast(E[entry.ex].n+' · '+(xa.optional ? 'set logged' : Math.min(xa.done,xa.target)+' of '+xa.target+' this week'), {undo:entry.id});
  }
}
function circleLog(id){

function celebrate(title, sub){

// ---------- Swap an exercise out of today's workout ----------
function skippedToday(today){ const s = readJSON('atg-skip', null); return s && s.date === today && Array.isArray(s.ids) ? s.ids : []; }
function swapOptions(outId){
  const W = computeWeek(); const out = W.ex.find(x => x.id === outId);
  const inWorkout = new Set(st.up ? st.up.ids : []); const skipped = skippedToday(W.today);
  const per = id => T[id].ideal.per || 1;
  const cost = id => Math.min(per(id), Math.max(1, (W.ex.find(x => x.id === id) || {}).left || 1)) * setTime(id);
  const outCost = cost(outId);
  return W.ex.filter(x => x.id !== outId && !inWorkout.has(x.id) && skipped.indexOf(x.id) === -1 && !x.optional && x.left > 0 &&
      (W.tdy[x.id]||0) < per(x.id) && (st.equip === 'All' || x.equip === st.equip))
    .map(x => {
      const why = [];
      let sc = 0;
      if (x.area === out.area) { sc += 3; why.push(x.area); }
      const shared = x.tags.filter(t => out.tags.indexOf(t) !== -1);
      if (shared.length) { sc += 1.5; why.push(short(shared[0])); }
      if (x.equip === out.equip) { sc += 1; why.push(x.equip); }
      sc -= Math.abs(cost(x.id) - outCost) / 120;
      sc += x.left / x.target;
      if (x.since === 1 && T[x.id].ideal.times <= 3) sc -= 1.5;
      sc += prioOf(x.id);
      return {x, sc, why};
    }).sort((a,b) => b.sc - a.sc);
}

  const r = document.getElementById('swap-root');

    '<div class="row-between" style="align-items:flex-start"><div><div class="small muted">Swap out for today</div><h1 style="font-size:22px;margin-top:4px">'+esc(E[outId].n)+'</h1></div><button class="back" style="font-size:15px" data-a="swap-close">Cancel</button></div>'+

    '<div class="lbl">'+(all ? 'Everything still due' : 'Best swaps')+'</div>'+

function doSwap(outId, inId){

function searchText(id){ return (E[id].n+' '+E[id].a+' '+E[id].q+' '+Object.keys(T[id].by).join(' ')+' '+(ALIAS[id]||'')).toLowerCase(); }

  if (el.dataset.a === 'menu-bg') { if (ev.target === el) closeMenu(); return; }
  if (el.dataset.a === 'add-bg') { if (ev.target === el) closeAdd(); return; }
  if (el.dataset.a === 'wrap-bg') { if (ev.target === el) document.getElementById('wrap-root').innerHTML = ''; return; }
  const a = el.dataset.a, v = el.dataset.v;
  if (a === 'sheet-bg') { if (ev.target === el) closeSheet(); return; }
  switch (a) {
    case 'tab': st.tab = v; st.detail = null; render(); window.scrollTo(0,0); break;
    case 'prot': st.prot = st.prot === v ? null : v; render(); break;
    case 'equip': st.equip = v; equipPref[bucket()] = v; writeJSON('atg-equip', equipPref); render(); break;
    case 'mins': st.mins = +v; try { localStorage.setItem('atg-mins', v); } catch(e){} render(); break;
    case 'prio-ex': { const [id, val] = v.split(':'); setPrio('ex', id, val === 'auto' ? null : +val); renderSheet(); render(); break; }
    case 'prio-p': { const [id, val] = v.split(':'); setPrio('p', id, +val); render(); break; }
    case 'clear': st.prot = null; st.equip = 'All'; st.area = 'All'; render(); break;
    case 'grp': st.open[v] = !st.open[v]; render(); break;
    case 'pview': st.pview = v; render(); break;
    case 'log-more': st.logLimit += 200; render(); break;
    case 'tq-clear': st.tq = ''; render(); { const i = document.getElementById('tq'); if (i) i.focus(); } break;
    case 's-open': openSheet(v); break;
    case 's-log': { const e = E[v]; if (e.k === 'time' || e.k === 'fail') { openSheet(v); break; }
      const id = circleLog(v); st.sLogged = v; render(); startRest(id);
      setTimeout(() => { if (st.sLogged === v) { st.sLogged = null; renderSearch(st.tq); } }, 1200); break; }
    case 'day': if (v <= dkey(new Date())) openDay(v); break;
    case 'day-close': st.day = null; renderDay(); break;
    case 'day-open': st.day = null; renderDay(); openSheet(v); break;
    case 'undo-del': if (lastDeleted && !logs.some(z => z.id === lastDeleted.id)) { logs.push(lastDeleted); logs.sort((a,b) => a.ts-b.ts); save(); syncWeeks([weekKey(lastDeleted.date)]); st.pop = lastDeleted.id; lastDeleted = null; render(); setTimeout(() => { st.pop = null; }, 800); toast('Set restored'); } break;
    case 'up-refresh': st.up = null; render(); break;
    case 'menu': openMenu(v); break;
    case 'menu-w': openMenu(v, 'weight'); break;
    case 'menu-weight': st.menu.view = 'weight'; renderMenu(); break;
    case 'menu-close': closeMenu(); break;
    case 'menu-sheet': closeMenu(); openSheet(v); break;
    case 'menu-remove': removeToday(v); break;
    case 'undo-rm': undoRemove(); break;
    case 'cust-hide-ask': st.menu.confirm = true; renderMenu(); break;
    case 'cust-hide': { const c = customs.find(z => z.id === v); if (c) { c.hidden = true; saveCustoms(); applyCustoms(); buildT(); } const today = dkey(new Date()); const ds = dayState(today); ds.added = ds.added.filter(z => z !== v); saveDay(ds); if (st.up) { st.up.ids = st.up.ids.filter(z => z !== v); writeJSON('atg-up', st.up); } closeMenu(); render(); toast('Custom exercise deleted'); break; }
    case 'batch-next': { const ds = dayState(dkey(new Date())); ds.batch++; ds.ended = false; saveDay(ds); render(); break; }
    case 'day-end': { const ds = dayState(dkey(new Date())); ds.ended = true; saveDay(ds); render(); window.scrollTo({top:0, behavior:'smooth'}); break; }
    case 'day-resume': { const ds = dayState(dkey(new Date())); ds.ended = false; ds.batch++; saveDay(ds); render(); break; }
    case 'prev-toggle': st.showPrev = !st.showPrev; render(); break;
    case 'add-open': openAdd(); break;
    case 'add-close': closeAdd(); break;
    case 'af-area': st.add.area = v; renderAdd(); break;
    case 'af-eq': st.add.eq = v; renderAdd(); break;
    case 'af-reset': st.add.area = 'All'; st.add.eq = 'All'; renderAdd(); break;
    case 'add-pick': addToday(v); break;
    case 'add-custom': st.add.view = 'custom'; st.add.err = ''; renderAdd(); setTimeout(() => { const i = document.getElementById('cn'); if (i) i.focus(); }, 50); break;
    case 'add-back': st.add.view = 'list'; renderAdd(); break;
    case 'cf-k': st.add.f.k = v; renderAdd(); break;
    case 'cf-s': st.add.f.s = !st.add.f.s; renderAdd(); break;
    case 'cf-l': st.add.f.l = !st.add.f.l; renderAdd(); break;
    case 'cf-q': st.add.f.q = v; renderAdd(); break;
    case 'cf-p': st.add.f.prot = v || null; renderAdd(); break;
    case 'cf-step': { const [k, d] = v.split(':'); const f = st.add.f; const lim = {sets:[1,10], r:[1,100], t:[5,600]}[k]; f[k] = Math.min(lim[1], Math.max(lim[0], f[k] + (+d))); renderAdd(); break; }
    case 'cust-save': { const f = st.add.f; const n = f.n.trim();
      if (!n) { st.add.err = 'Give it a name first.'; renderAdd(); break; }
      if (Object.keys(E).some(id => !E[id].hidden && E[id].n.toLowerCase() === n.toLowerCase())) { st.add.err = 'There\'s already an exercise called that. Search for it instead.'; renderAdd(); break; }
      const c = {id:'c_'+Date.now().toString(36), n, k:f.k, sets:f.sets, r:f.r, t:f.t, s:f.s, l:f.l, q:f.q, prot:f.prot};
      customs.push(c); saveCustoms(); applyCustoms(); buildT(); st.up = null; addToday(c.id); break; }
    case 'swap': closeMenu(); openSwap(v, false); break;
    case 'swap-all': openSwap(v, true); break;
    case 'swap-close': document.getElementById('swap-root').innerHTML = ''; break;
    case 'swap-pick': { const [o, n] = v.split(':'); doSwap(o, n); break; }
    case 'ld-open': st.ldOpen = st.ldOpen === v ? null : v; render(); break;
    case 'ld-done': st.ldOpen = null; render(); break;
    case 'ld-step': { const [id, d] = v.split(':'); setLoad(id, curLoad(id) + parseFloat(d)); render(); break; }
    case 'ld-set': { const [id, d] = v.split(':'); setLoad(id, parseFloat(d)); render(); break; }
    case 'ld-apply': { const w = curLoad(v); const td = dkey(new Date()); let wk = null;
      logs.forEach(l => { if (l.ex === v && l.date === td) { if (w) l.load = w; else delete l.load; wk = weekKey(l.date); } });
      save(); if (wk) syncWeeks([wk]); render(); toast('Today\'s sets updated'); break; }
    case 'c-add': { const e = E[v]; if (e.k === 'time' || e.k === 'fail') { openSheet(v); break; } const id = circleLog(v); render(); startRest(id); break; }
    case 'c-tap': { const l = logs.find(z => z.id === v); if (!l) break;
      if (E[l.ex].k !== 'reps') { openSheet(l.ex); break; }
      l.reps = (l.reps||0) - 1; st.pop = null;
      if (l.reps <= 0) { logs = logs.filter(z => z.id !== v); toast('Set removed'); if (st.rest && st.rest.logId === v) stopRest(); }
      save(); syncWeeks([weekKey(l.date)]); render(); break; }
    case 'rest-close': stopRest(); break;
    case 'rest-effort': { const l = st.rest && logs.find(z => z.id === st.rest.logId); if (l) { l.effort = +v; save(); syncWeeks([weekKey(l.date)]); renderRest(); clearTimeout(confT); confT = setTimeout(stopRest, 1100); } break; }
    case 'open': openSheet(v); break;
    case 'close': closeSheet(); break;
    case 'detail': st.detail = v; st.dview = 'ex'; render(); window.scrollTo(0,0); break;
    case 'detail-back': st.detail = null; render(); break;
    case 'dview': st.dview = v; render(); break;
    case 'f': { const [k,d] = v.split(':'); const step = parseFloat(d);
      if (k === 'reps') st.form.reps = Math.max(0, st.form.reps+step);
      if (k === 'load') st.form.load = Math.max(0, Math.round((st.form.load+step)*10)/10);
      if (k === 'secs') { st.form.secs = Math.max(5, st.form.secs+step); const n = document.getElementById('tsecs'); if (n) { n.textContent = fmtSecs(st.form.secs); return; } }
      renderSheet(); break; }
    case 'side': st.form.side = v; st.timer = null; renderSheet(); break;
    case 'effort': st.form.effort = +v; renderSheet(); break;
    case 'ttoggle': toggleTimer(); break;
    case 'tadj': { const tm = st.timer; if (tm && !tm.done) { tm.target = Math.max(5, tm.target + (+v)); paintTimer(); } break; }
    case 'treset': stopTimer(); st.timer = null; renderSheet(); break;
    case 'log': {
      const id = st.sheet, e = E[id], f = st.form, now = new Date();
      const entry = {id: now.getTime().toString(36)+Math.random().toString(36).slice(2,6), ex:id, ts:now.getTime(), date:dkey(now), effort:f.effort};
      if (e.k === 'reps') entry.reps = f.reps;
      if (e.k === 'time' || e.k === 'fail') entry.secs = f.secs;
      if (e.l && f.load) entry.load = f.load;
      if (e.l) setLoad(id, f.load || 0);
      if (e.s) entry.side = f.side;
      stopTimer(); st.timer = null;
      st.pop = entry.id; commitLog(entry); render(); renderSheet(); startRest(entry.id); break; }
    case 'undo': { const gone = logs.find(l => l.id === v); if (gone) { logs = logs.filter(l => l.id !== v); save(); syncWeeks([weekKey(gone.date)]); render(); if (st.sheet) renderSheet(); toast('Set removed'); } break; }
    case 'tip-off': setFlag('tip-circles'); render(); break;
    case 'wrap': openWrap(v); break;
    case 'wrap-close': document.getElementById('wrap-root').innerHTML = ''; break;
    case 'wrap-dismiss': setFlag('wrap-'+v); render(); break;
    case 'cel-close': document.getElementById('cel-root').innerHTML = ''; break;
    case 'del': { const gone = logs.find(l => l.id === v); logs = logs.filter(l => l.id !== v); save(); if (gone) syncWeeks([weekKey(gone.date)]); } render(); renderSheet(); toast('Set deleted'); break;
    case 'csv': offerFile('atg-sets-'+dkey(new Date())+'.csv', csv(), 'text/csv'); break;
    case 'backup': offerFile('atg-backup-'+dkey(new Date())+'.json', JSON.stringify({v:1, exported:new Date().toISOString(), logs, loads:loadPref, customs}), 'application/json'); break;
    case 'copy': { const t = document.getElementById('exptext'); try { navigator.clipboard.writeText(t.value).then(() => toast('Copied'), () => { t.select(); toast('Select all and copy'); }); } catch(e){ t.select(); } break; }
    case 'restore': st.restore = !st.restore; render(); break;
    case 'restore-go': { const t = document.getElementById('rtext'); if (t && t.value.trim()) restore(t.value); else toast('Choose a file or paste a backup first'); break; }
    case 'clear-ask': st.confirmClear = true; render(); break;
    case 'clear-no': st.confirmClear = false; render(); break;
    case 'clear-yes': { const wks = logs.map(l => weekKey(l.date)); logs = []; save(); syncWeeks(wks); } st.confirmClear = false; render(); toast('All data deleted'); break;
  }
});
document.addEventListener('change', ev => {
  const c = ev.target.dataset && ev.target.dataset.c; if (!c) return;
  if (c === 'area') { st.area = ev.target.value; render(); }
  if (c === 'rfile') { const file = ev.target.files && ev.target.files[0]; if (!file) return; const r = new FileReader(); r.onload = () => restore(String(r.result)); r.readAsText(file); }
});
document.addEventListener('input', ev => {
  if (ev.target && ev.target.id === 'aq' && st.add) { st.add.q = ev.target.value; renderAddList(); return; }
  if (ev.target && ev.target.id === 'cn' && st.add) { st.add.f.n = ev.target.value; if (st.add.err) { st.add.err = ''; } return; }
  if (!ev.target || ev.target.id !== 'tq') return;
  const had = !!st.tq; st.tq = ev.target.value; renderSearch(st.tq);
  const wrap = ev.target.parentNode; const x = wrap.querySelector('.tq-x');
  if (st.tq && !x) wrap.insertAdjacentHTML('beforeend', '<button class="tq-x" aria-label="Clear search" data-a="tq-clear">×</button>');
  if (!st.tq && x) x.remove();
});
document.addEventListener('keydown', ev => { if (ev.key !== 'Escape') return; if (document.activeElement && document.activeElement.id === 'tq' && st.tq) { st.tq = ''; render(); return; } if (st.menu) closeMenu(); else if (st.add) closeAdd(); else if (st.sheet) closeSheet(); else if (st.day) { st.day = null; renderDay(); } });
document.addEventListener('visibilitychange', () => { if (!document.hidden) { render(); if (st.sheet) paintTimer(); } });

document.getElementById('ver').textContent = 'v'+APP_VERSION;
load(); if (equipPref[bucket()]) st.equip = equipPref[bucket()]; render(); initCloud();
</script>
